services:
  - type: web
    name: smartlocker-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python start.py
    healthCheckPath: /health
    disk:
      name: smartlocker-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: HOST
        value: 0.0.0.0
      - key: UVICORN_RELOAD
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////var/data/smartlocker.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: EMAIL_DELIVERY_MODE
        value: console
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: TELEGRAM_BOT_API_KEY
        sync: false
      - key: SMARTLOCKER_API_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@smartlocker.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: TRAVELLINE_CLIENT_ID
        sync: false
      - key: TRAVELLINE_CLIENT_SECRET
        sync: false
      - key: TRAVELLINE_PROPERTY_ID
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        sync: false

  - type: worker
    name: smartlocker-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python run_telegram_bot.py
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_API_KEY
        sync: false
      - key: TELEGRAM_BOT_API_BASE_URL
        value: ""
      - key: TELEGRAM_BOT_API_INTERNAL_HOST
        fromService:
          type: web
          name: smartlocker-api
          property: host
      - key: TELEGRAM_BOT_API_INTERNAL_PORT
        fromService:
          type: web
          name: smartlocker-api
          property: port
      - key: TELEGRAM_PROXY_URL
        sync: false
