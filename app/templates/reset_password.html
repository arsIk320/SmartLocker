{% extends "base.html" %}
{% block content %}
<section class="auth-screen">
    <div class="auth-card compact">
        <div class="panel-head">
            <span class="eyebrow">Новый пароль</span>
            <h2>Введите код и задайте новый пароль</h2>
            <p>Код действует ограниченное время, поэтому лучше использовать его сразу после получения.</p>
        </div>
        {% if error %}
        <div class="alert error">{{ error }}</div>
        {% endif %}
        <form method="post" action="/reset-password" class="form-grid">
            <label>
                <span>Email</span>
                <input type="email" name="email" value="{{ form.email }}" required>
            </label>
            <label>
                <span>Код</span>
                <input type="text" name="code" value="{{ form.code }}" placeholder="123456" required>
            </label>
            <label>
                <span>Новый пароль</span>
                <div class="password-field">
                    <input id="reset-password" type="password" name="new_password" value="{{ form.new_password }}" placeholder="Введите новый пароль" required>
                    <button class="password-toggle" type="button" data-target="reset-password" aria-label="Показать пароль">👁</button>
                </div>
            </label>
            <button class="btn primary" type="submit">Сохранить новый пароль</button>
        </form>
    </div>
</section>
<script src="/static/app.js"></script>
{% endblock %}
